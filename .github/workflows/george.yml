name: george-api

on:
  push:
    branches: [master, "george/**"]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/nucleo-ebpos/george-api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: george
          POSTGRES_PASSWORD: george
          POSTGRES_DB: george_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U george" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: go vet
        run: go vet ./george/... ./cmd/...
      - name: "go test (regras: permissões, convites, host, isolamento)"
        env:
          GEORGE_TEST_DB_URL: postgres://george:george@127.0.0.1:5433/george_test?sslmode=disable
        run: go test -p 1 -timeout 300s ./george/... -count=1 -v
      - name: build
        run: go build ./cmd/...

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.george
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
